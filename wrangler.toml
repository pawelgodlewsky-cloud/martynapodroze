name = "martyna-wyjazdy"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false

# Worker obsługuje tylko nowy moduł. Obecna strona główna nadal jest
# serwowana przez dotychczasowy origin (GitHub Pages).
routes = [
  { pattern = "martynapodroze.pl/admin/wyjazdy*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/api/admin/*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/api/newsletter/*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/api/blog/*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/api/stripe/*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/dostep/lombardia*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/zakup/lombardia*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/podglad/como*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/como*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/dostep/rzym*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/podglad/rzym*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/romatest123*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/rzym*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/guides*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/w/*", zone_name = "martynapodroze.pl" },
  { pattern = "martynapodroze.pl/go/*", zone_name = "martynapodroze.pl" }
]

[vars]
ADMIN_EMAIL = "podroz.martyna@gmail.com"
MAILERLITE_GROUP_ID = "195505150832411742"
TRANSACTIONAL_FROM_EMAIL = "Martyna_podroze <przewodnik@martynapodroze.pl>"
STRIPE_PAYMENT_LINK_ID = "plink_1U8PrvGma628jLpWAvxXY3uj"

[assets]
directory = "./worker-public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "martyna-wyjazdy"
database_id = "b1559654-57b5-4090-aed0-82996d9774a4"
migrations_dir = "migrations"

